name: Automated Release & Portable Executables Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test-and-validate:
    name: Run Automated Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Execute Vitest Automated Suite
        run: bun run test

  build-tauri-executables:
    name: Build Portable Desktop (${{ matrix.platform.name }})
    needs: test-and-validate
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            name: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macos
            target: x86_64-apple-darwin
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux GTK & C Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsoup-3.0-dev

      - name: Install Project Dependencies
        run: bun install

      - name: Build Tauri Desktop Executables
        run: bun run tauri:build

      - name: Prepare Staged Executable Assets
        shell: bash
        run: |
          mkdir -p staged-assets
          if [ "${{ matrix.platform.name }}" = "linux" ]; then
            find src-tauri/target/release/bundle -type f -name "*.AppImage" -exec cp {} staged-assets/ \;
            find src-tauri/target/release/bundle -type f -name "*.deb" -exec cp {} staged-assets/ \;
          elif [ "${{ matrix.platform.name }}" = "macos" ]; then
            find src-tauri/target/release/bundle -type f -name "*.dmg" -exec cp {} staged-assets/ \;
          elif [ "${{ matrix.platform.name }}" = "windows" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} staged-assets/ \;
          fi
          echo "Staged executable files:"
          ls -lh staged-assets/

      - name: Upload Platform Executables
        uses: actions/upload-artifact@v4
        with:
          name: desktop-executables-${{ matrix.platform.name }}
          path: staged-assets/*
          retention-days: 1

  semantic-release:
    name: Execute Semantic Release & Upload Executable Assets
    needs: [test-and-validate, build-tauri-executables]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Download Linux Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-linux
          path: release-assets

      - name: Download macOS Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-macos
          path: release-assets

      - name: Download Windows Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-windows
          path: release-assets

      - name: Display Release Asset List
        run: |
          echo "All release assets staged for semantic-release:"
          ls -lh release-assets/

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
