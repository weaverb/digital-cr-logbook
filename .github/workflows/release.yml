name: Automated Release & Portable Executables Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-validate:
    name: Run Automated Tests, Bump Version & Update CHANGELOG
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_notes: ${{ steps.changelog.outputs.release_notes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Execute Vitest Automated Suite
        run: bun run test

      - name: Automate SemVer Version Bump & CHANGELOG.md Update
        id: version
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");

            const pkgPath = "./package.json";
            const tauriConfPath = "./src-tauri/tauri.conf.json";
            const changelogPath = "./CHANGELOG.md";

            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            let currentVersion = pkg.version || "1.0.0";

            let latestTag = "";
            try {
              latestTag = execSync("git describe --tags --abbrev=0", { encoding: "utf8" }).trim();
            } catch (e) {}

            let logRange = latestTag ? `${latestTag}..HEAD` : "HEAD~10..HEAD";
            let commits = [];
            try {
              const rawLog = execSync(`git log ${logRange} --pretty=format:"%h|%s"`, { encoding: "utf8" });
              commits = rawLog.split("\n").filter(Boolean).map(line => {
                const parts = line.split("|");
                return { hash: parts[0], subject: parts.slice(1).join("|") };
              });
            } catch (e) {}

            let isMajor = false;
            let isMinor = false;
            let isPatch = false;

            const added = [];
            const fixed = [];
            const changed = [];
            const security = [];

            for (const c of commits) {
              const msg = c.subject;
              if (msg.startsWith("chore(release):") || msg.startsWith("Merge pull request") || msg.startsWith("Merge branch")) {
                continue;
              }

              if (/BREAKING CHANGE|!:/.test(msg)) {
                isMajor = true;
              }
              
              if (/^feat(\([^\)]+\))?:/.test(msg) || /\bfeat\b/.test(msg)) {
                isMinor = true;
                added.push(msg.replace(/^feat(\([^\)]+\))?:\s*/, ""));
              } else if (/^fix(\([^\)]+\))?:/.test(msg) || /\bfix\b/.test(msg)) {
                isPatch = true;
                fixed.push(msg.replace(/^fix(\([^\)]+\))?:\s*/, ""));
              } else if (/^(perf|refactor|style|docs)(\([^\)]+\))?:/.test(msg)) {
                isPatch = true;
                changed.push(msg.replace(/^(perf|refactor|style|docs)(\([^\)]+\))?:\s*/, ""));
              } else if (/^security(\([^\)]+\))?:/.test(msg)) {
                isPatch = true;
                security.push(msg.replace(/^security(\([^\)]+\))?:\s*/, ""));
              } else {
                changed.push(msg);
              }
            }

            const baseTag = latestTag ? latestTag.replace(/^v/, "") : currentVersion;
            const parts = baseTag.split(".").map(Number);
            let major = parts[0] || 1;
            let minor = parts[1] || 0;
            let patch = parts[2] || 0;

            if (isMajor) {
              major += 1; minor = 0; patch = 0;
            } else if (isMinor) {
              minor += 1; patch = 0;
            } else if (isPatch || commits.length > 0) {
              patch += 1;
            }

            const nextVersion = `${major}.${minor}.${patch}`;
            const dateStr = new Date().toISOString().split("T")[0];

            pkg.version = nextVersion;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            try {
              const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
              tauriConf.version = nextVersion;
              fs.writeFileSync(tauriConfPath, JSON.stringify(tauriConf, null, 2) + "\n");
            } catch (e) {}

            let newReleaseMd = `\n## [${nextVersion}] - ${dateStr}\n`;
            if (added.length > 0) {
              newReleaseMd += `\n### Added\n` + added.map(i => `- ${i}`).join("\n") + `\n`;
            }
            if (changed.length > 0) {
              newReleaseMd += `\n### Changed\n` + changed.map(i => `- ${i}`).join("\n") + `\n`;
            }
            if (fixed.length > 0) {
              newReleaseMd += `\n### Fixed\n` + fixed.map(i => `- ${i}`).join("\n") + `\n`;
            }
            if (security.length > 0) {
              newReleaseMd += `\n### Security\n` + security.map(i => `- ${i}`).join("\n") + `\n`;
            }
            if (added.length === 0 && changed.length === 0 && fixed.length === 0 && security.length === 0) {
              newReleaseMd += `\n### Changed\n- Maintenance updates and enhancements for release v${nextVersion}.\n`;
            }

            let changelog = fs.readFileSync(changelogPath, "utf8");
            if (changelog.includes("## [Unreleased]")) {
              changelog = changelog.replace("## [Unreleased]", "## [Unreleased]\n" + newReleaseMd);
            } else {
              changelog = changelog + "\n" + newReleaseMd;
            }
            fs.writeFileSync(changelogPath, changelog);

            console.log(`Automated release version: v${nextVersion} (Date: ${dateStr})`);
            const delim = `EOF_RELEASE_${Date.now()}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag_name=v${nextVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_notes<<${delim}\n${newReleaseMd.trim()}\n${delim}\n`);
            fs.writeFileSync("release_notes.md", newReleaseMd.trim());
          '

      - name: Commit & Push Version Bump & CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to v${{ steps.version.outputs.version }} and update CHANGELOG [skip ci]"
            git push
          fi

  build-tauri-executables:
    name: Build Portable Desktop (${{ matrix.platform.name }})
    needs: test-and-validate
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            name: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macos
            target: x86_64-apple-darwin
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux GTK & C Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsoup-3.0-dev

      - name: Install Project Dependencies
        run: bun install

      - name: Build Tauri Desktop Executables
        run: bun run tauri:build

      - name: Prepare Staged Executable Assets
        shell: bash
        run: |
          mkdir -p staged-assets
          if [ "${{ matrix.platform.name }}" = "linux" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} staged-assets/ \;
          elif [ "${{ matrix.platform.name }}" = "macos" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.zip" \) -exec cp {} staged-assets/ \;
          elif [ "${{ matrix.platform.name }}" = "windows" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} staged-assets/ \;
          fi
          echo "Staged executable files:"
          ls -lh staged-assets/

      - name: Upload Platform Executables
        uses: actions/upload-artifact@v4
        with:
          name: desktop-executables-${{ matrix.platform.name }}
          path: staged-assets/*
          retention-days: 7

  github-release:
    name: Create GitHub Release & Upload Executable Assets
    needs: [test-and-validate, build-tauri-executables]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-linux
          path: release-assets

      - name: Download macOS Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-macos
          path: release-assets

      - name: Download Windows Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-windows
          path: release-assets

      - name: Display Release Asset List
        run: |
          echo "All release assets to be uploaded:"
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test-and-validate.outputs.tag_name }}
          name: C&R Digital Logbook ${{ needs.test-and-validate.outputs.tag_name }}
          body: ${{ needs.test-and-validate.outputs.release_notes }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
