name: Automated Release & Portable Executables Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-validate:
    name: Run Automated Tests & Parse Changelog
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_notes: ${{ steps.changelog.outputs.release_notes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Execute Vitest Automated Suite
        run: bun run test

      - name: Determine Target Semantic Release Version
        id: version
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");

            let pkgVersion = "1.0.0";
            try {
              pkgVersion = JSON.parse(fs.readFileSync("./package.json", "utf8")).version || "1.0.0";
            } catch (e) {}

            let latestTag = "";
            try {
              latestTag = execSync("git describe --tags --abbrev=0", { encoding: "utf8" }).trim();
            } catch (e) {}

            let targetVersion = pkgVersion;

            if (latestTag) {
              const cleanTag = latestTag.replace(/^v/, "");
              const parts = cleanTag.split(".").map(Number);
              let major = parts[0] || 1;
              let minor = parts[1] || 0;
              let patch = parts[2] || 0;

              let log = "";
              try {
                log = execSync(`git log ${latestTag}..HEAD --oneline`, { encoding: "utf8" });
              } catch (e) {}

              let isMajor = false;
              let isMinor = false;
              let isPatch = false;

              if (log) {
                const lines = log.split("\n");
                for (const line of lines) {
                  if (/BREAKING CHANGE|feat!|fix!/.test(line)) isMajor = true;
                  else if (/\bfeat\b|feat\(/.test(line)) isMinor = true;
                  else if (/\bfix\b|fix\(|\bperf\b|\brefactor\b/.test(line)) isPatch = true;
                }
              }

              if (isMajor) {
                major += 1;
                minor = 0;
                patch = 0;
              } else if (isMinor) {
                minor += 1;
                patch = 0;
              } else if (isPatch) {
                patch += 1;
              }

              const calculated = `${major}.${minor}.${patch}`;
              
              const semverCompare = (v1, v2) => {
                const p1 = v1.split(".").map(Number);
                const p2 = v2.split(".").map(Number);
                for (let i = 0; i < 3; i++) {
                  if ((p1[i] || 0) > (p2[i] || 0)) return 1;
                  if ((p1[i] || 0) < (p2[i] || 0)) return -1;
                }
                return 0;
              };

              targetVersion = semverCompare(calculated, pkgVersion) > 0 ? calculated : pkgVersion;
            }

            console.log(`Determined SemVer: ${targetVersion} (Latest tag: ${latestTag || "none"})`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${targetVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag_name=v${targetVersion}\n`);
          '

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract release notes section for the current version from CHANGELOG.md
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          
          if [ ! -s release_notes.md ]; then
            echo "Release notes for version $VERSION not found in CHANGELOG.md. Using fallback release notes."
            echo "Automated portable desktop release for C&R Collector Digital Logbook v$VERSION." > release_notes.md
          fi
          
          {
            echo 'release_notes<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  build-tauri-executables:
    name: Build Portable Desktop (${{ matrix.platform.name }})
    needs: test-and-validate
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            name: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macos
            target: x86_64-apple-darwin
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux GTK & C Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsoup-3.0-dev

      - name: Install Project Dependencies
        run: bun install

      - name: Build Tauri Desktop Executables
        run: bun run tauri:build

      - name: Prepare Staged Executable Assets
        shell: bash
        run: |
          mkdir -p staged-assets
          if [ "${{ matrix.platform.name }}" = "linux" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} staged-assets/ \;
          elif [ "${{ matrix.platform.name }}" = "macos" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.zip" \) -exec cp {} staged-assets/ \;
          elif [ "${{ matrix.platform.name }}" = "windows" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} staged-assets/ \;
          fi
          echo "Staged executable files:"
          ls -lh staged-assets/

      - name: Upload Platform Executables
        uses: actions/upload-artifact@v4
        with:
          name: desktop-executables-${{ matrix.platform.name }}
          path: staged-assets/*
          retention-days: 7

  github-release:
    name: Create GitHub Release & Upload Executable Assets
    needs: [test-and-validate, build-tauri-executables]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-linux
          path: release-assets

      - name: Download macOS Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-macos
          path: release-assets

      - name: Download Windows Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-windows
          path: release-assets

      - name: Display Release Asset List
        run: |
          echo "All release assets to be uploaded:"
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test-and-validate.outputs.tag_name }}
          name: C&R Digital Logbook ${{ needs.test-and-validate.outputs.tag_name }}
          body: ${{ needs.test-and-validate.outputs.release_notes }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
