name: Automated Release & Portable Executables Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-release:
    name: Run Tests, Analyze SemVer & Pre-sync Config Files
    runs-on: ubuntu-22.04
    outputs:
      has_release: ${{ steps.version.outputs.has_release }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Execute Vitest Automated Suite
        run: bun run test

      - name: Calculate Next Version & Pre-sync Config Files
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run dry-run semantic-release to calculate next release version
          RELEASE_OUTPUT=$(bunx semantic-release --dry-run 2>&1 || true)
          echo "$RELEASE_OUTPUT"

          NEXT_VERSION=$(echo "$RELEASE_OUTPUT" | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)

          if [ -z "$NEXT_VERSION" ]; then
            echo "No release required for this commit."
            echo "has_release=false" >> $GITHUB_OUTPUT
          else
            echo "Calculated next release version: v${NEXT_VERSION}"
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
            echo "tag_name=v${NEXT_VERSION}" >> $GITHUB_OUTPUT

            # Sync package.json, tauri.conf.json, and docs/index.html BEFORE build matrix starts!
            bun scripts/update-version-files.js "${NEXT_VERSION}"
          fi

      - name: Upload Pre-synced Version Config Artifacts
        if: steps.version.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prepared-version-configs
          path: |
            package.json
            src-tauri/tauri.conf.json
            docs/index.html
          retention-days: 1

  build-tauri-executables:
    name: Build Portable Desktop (${{ matrix.platform.name }})
    needs: prepare-release
    if: needs.prepare-release.outputs.has_release == 'true'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            name: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macos
            target: x86_64-apple-darwin
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Pre-synced Version Config Artifacts
        uses: actions/download-artifact@v4
        with:
          name: prepared-version-configs
          path: ./

      - name: Verify Pre-synced Version Configuration
        shell: bash
        run: |
          echo "Verified package.json version:"
          grep '"version"' package.json
          echo "Verified tauri.conf.json version:"
          grep '"version"' src-tauri/tauri.conf.json

      - name: Setup Node & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux GTK & C Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsoup-3.0-dev

      - name: Install Project Dependencies
        run: bun install

      - name: Build Tauri Desktop Executables
        run: bun run tauri:build

      - name: Prepare Staged Executable Assets
        shell: bash
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          mkdir -p staged-assets
          if [ "${{ matrix.platform.name }}" = "linux" ]; then
            find src-tauri/target/release/bundle -type f -name "*.AppImage" -exec cp {} staged-assets/Digital-CR-Logbook-v${VERSION}-x86_64.AppImage \;
            find src-tauri/target/release/bundle -type f -name "*.deb" -exec cp {} staged-assets/Digital-CR-Logbook-v${VERSION}-amd64.deb \;
          elif [ "${{ matrix.platform.name }}" = "macos" ]; then
            find src-tauri/target/release/bundle -type f -name "*.dmg" -exec cp {} staged-assets/Digital-CR-Logbook-v${VERSION}-x64.dmg \;
          elif [ "${{ matrix.platform.name }}" = "windows" ]; then
            find src-tauri/target/release/bundle -type f -name "*-setup.exe" -exec cp {} staged-assets/Digital-CR-Logbook-v${VERSION}-x64-setup.exe \;
            find src-tauri/target/release/bundle -type f -name "*.msi" -exec cp {} staged-assets/Digital-CR-Logbook-v${VERSION}-x64.msi \;
          fi
          echo "Staged executable files for v${VERSION}:"
          ls -lh staged-assets/

      - name: Upload Platform Executables
        uses: actions/upload-artifact@v4
        with:
          name: desktop-executables-${{ matrix.platform.name }}
          path: staged-assets/*
          retention-days: 1

  semantic-release:
    name: Execute Semantic Release & Upload Executable Assets
    needs: [prepare-release, build-tauri-executables]
    if: needs.prepare-release.outputs.has_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Download Linux Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-linux
          path: release-assets

      - name: Download macOS Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-macos
          path: release-assets

      - name: Download Windows Executables
        uses: actions/download-artifact@v4
        with:
          name: desktop-executables-windows
          path: release-assets

      - name: Display Release Asset List
        run: |
          echo "All release assets staged for semantic-release:"
          ls -lh release-assets/

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
